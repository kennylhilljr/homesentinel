version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8443:8443"
    environment:
      - BACKEND_PORT=8443
      # Explicit LAN exposure: a non-loopback bind requires an API key and TLS certs in ./backend/certs
      - HOMESENTINEL_HOST=0.0.0.0
      - HOMESENTINEL_API_KEY=${HOMESENTINEL_API_KEY:?Set HOMESENTINEL_API_KEY to expose HomeSentinel beyond localhost}
      - LOG_LEVEL=INFO
    volumes:
      # Host source (and its SQLite DB / .credential_key) at /app/backend; the
      # image's built dashboard at /app/frontend/build stays visible.
      - ./backend:/app/backend
      - ./backend/certs:/app/backend/certs:ro
    command: python main.py
    networks:
      - homesentinel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8443/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:2026:2026"
    environment:
      # Vite proxies /api to the backend service (server-side only, not in the bundle).
      - HOMESENTINEL_PROXY_TARGET=https://backend:8443
      # Container must listen on 0.0.0.0; the host publishes 2026 on loopback only.
      - HOMESENTINEL_FRONTEND_HOST=0.0.0.0
      - HOMESENTINEL_ALLOW_INSECURE_BIND=1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start
    networks:
      - homesentinel-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2026"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  homesentinel-network:
    driver: bridge

volumes:
  backend_logs:
  frontend_logs:
