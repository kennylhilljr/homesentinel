name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt flake8
      - name: Lint (syntax errors and undefined names)
        run: flake8 . --count --select=E9,F63,F7,F821,F822,F823 --show-source --statistics
      - name: Test
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
        env:
          CI: "true"
      - name: Build
        run: npm run build

  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate TLS certificates and a throwaway API key
        run: |
          bash scripts/gen-cert.sh
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          echo "HOMESENTINEL_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Build
        run: docker compose build
      - name: Start
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test
        run: |
          curl -fk https://localhost:8443/api/health
          curl -fk https://localhost:8443/ -o root.html
          grep -q '<div id="root">' root.html
          asset="$(grep -o '/assets/[^"]*\.js' root.html | head -n1)"
          test -n "$asset"
          test "$(curl -sk -o /dev/null -w '%{http_code}' "https://localhost:8443$asset")" = 200
          test "$(curl -sk -o /dev/null -w '%{http_code}' https://localhost:8443/api/devices)" = 401
          curl -fk -o /dev/null -H "X-API-Key: $HOMESENTINEL_API_KEY" https://localhost:8443/api/devices
          curl -f http://127.0.0.1:2026/api/health
          test "$(docker compose port frontend 2026)" = "127.0.0.1:2026"
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
